<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>thedeepanshu</title>
  <defs>
    <radialGradient id="tile" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#10232a"/>
      <stop offset="1" stop-color="#05090b"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef4db"/>
      <stop offset="1" stop-color="#a17eff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark space tile -->
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <!-- HUD corner brackets, as on the site's frame and cursor lock-on -->
  <g fill="none" stroke="#7ef4db" stroke-width="2.6" stroke-linecap="round" opacity=".7">
    <path d="M9 17V9h8M47 9h8v8M55 47v8h-8M17 55H9v-8"/>
  </g>

  <!-- "D." monogram -->
  <g filter="url(#glow)">
    <path d="M20 18h9.5a14 14 0 0 1 0 28H20Z" fill="none" stroke="url(#mark)" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="47.5" cy="43" r="3.4" fill="#7ef4db"/>
  </g>
</svg>
